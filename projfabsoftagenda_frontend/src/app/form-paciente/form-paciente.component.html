<div class="page-content">
  <div class="page-header">
    <h1>{{ paciente.id ? 'Editar' : 'Novo' }} Paciente</h1>
    <p>Preencha os dados do paciente abaixo.</p>
  </div>

  <div class="form-card">
    <form #formPaciente="ngForm" class="row g-4" (ngSubmit)="salvar()" novalidate>

      <div class="col-md-6">
        <label class="form-label-mod" [ngClass]="{'text-danger': nome.invalid && nome.touched}">Nome Completo</label>
        <input type="text" class="form-control" [(ngModel)]="paciente.nome" name="nome" required #nome="ngModel"
          [ngClass]="{'is-invalid': nome.invalid && nome.touched}" placeholder="Nome do paciente">
        <div *ngIf="nome.invalid && nome.touched" class="error-msg">Nome é obrigatório.</div>
      </div>

      <div class="col-md-6">
        <label class="form-label-mod" [ngClass]="{'text-danger': idade.invalid && idade.touched}">Idade</label>
        <input type="number" class="form-control" [(ngModel)]="paciente.idade" name="idade" required #idade="ngModel"
          [ngClass]="{'is-invalid': idade.invalid && idade.touched}" placeholder="Ex: 72">
        <div *ngIf="idade.invalid && idade.touched" class="error-msg">Idade é obrigatória.</div>
      </div>

      <div class="col-12">
        <label class="form-label-mod" [ngClass]="{'text-danger': endereco.invalid && endereco.touched}">Endereço</label>
        <input type="text" class="form-control" [(ngModel)]="paciente.endereco" name="endereco" required #endereco="ngModel"
          [ngClass]="{'is-invalid': endereco.invalid && endereco.touched}" placeholder="Rua, número, bairro, cidade">
        <div *ngIf="endereco.invalid && endereco.touched" class="error-msg">Endereço é obrigatório.</div>
      </div>

      <div class="col-md-6">
        <label class="form-label-mod" [ngClass]="{'text-danger': email.invalid && email.touched}">Email</label>
        <input type="email" class="form-control" [(ngModel)]="paciente.email" name="email" required #email="ngModel"
          [ngClass]="{'is-invalid': email.invalid && email.touched}" placeholder="email@exemplo.com">
        <div *ngIf="email.invalid && email.touched" class="error-msg">Email válido é obrigatório.</div>
      </div>

      <div class="col-md-6">
        <label class="form-label-mod" [ngClass]="{'text-danger': telefone.invalid && telefone.touched}">Telefone de Emergência</label>
        <input type="text" class="form-control" [(ngModel)]="paciente.telefone" name="telefone" required #telefone="ngModel"
          mask="(00) 00000-0000" [ngClass]="{'is-invalid': telefone.invalid && telefone.touched}" placeholder="(00) 00000-0000">
        <div *ngIf="telefone.invalid && telefone.touched" class="error-msg">Telefone é obrigatório.</div>
      </div>

      <div class="col-12" style="display:flex; gap:12px; justify-content:flex-end; padding-top:8px;">
        <a class="btn-ghost-mod" routerLink="/pacientes">Cancelar</a>
        <button type="submit" class="btn-primary-mod">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          Salvar Paciente
        </button>
      </div>
    </form>
  </div>
</div>
