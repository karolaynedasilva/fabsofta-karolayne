<app-header></app-header>

<div style="background:#f1f4f9; min-height:calc(100vh - 60px);">
  <div class="container py-4" style="max-width:600px;">

    <div class="mb-4">
      <button (click)="voltar()"
        style="background:none; border:none; color:#6366f1; font-size:0.88rem; font-weight:600; cursor:pointer; padding:0; display:flex; align-items:center; gap:4px; margin-bottom:8px;">
        ← Voltar
      </button>
      <h1 class="fw-bold mb-1" style="color:#0f172a; font-size:1.4rem;">
        {{ editando ? 'Editar Medicamento' : 'Novo Medicamento' }}
      </h1>
    </div>

    <div style="background:#fff; border-radius:16px; box-shadow:0 1px 4px rgba(0,0,0,0.07); padding:28px;">
      <form #formMed="ngForm" (ngSubmit)="salvar()">

        <div class="mb-3">
          <label style="font-size:0.85rem; font-weight:600; color:#374151; display:block; margin-bottom:6px;">Nome do Medicamento *</label>
          <input type="text" name="nome" [(ngModel)]="medicamento.nome" required
            style="width:100%; border:1px solid #e2e8f0; border-radius:10px; padding:10px 14px; font-size:0.92rem; outline:none; transition:border-color 0.15s;"
            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'"
            placeholder="Ex: Aricept, Donepezil...">
          <span *ngIf="formMed.submitted && formMed.controls['nome']?.invalid" style="color:#dc2626; font-size:0.78rem;">Campo obrigatório.</span>
        </div>

        <div class="mb-3">
          <label style="font-size:0.85rem; font-weight:600; color:#374151; display:block; margin-bottom:6px;">Dosagem *</label>
          <input type="text" name="dosagem" [(ngModel)]="medicamento.dosagem" required
            style="width:100%; border:1px solid #e2e8f0; border-radius:10px; padding:10px 14px; font-size:0.92rem; outline:none; transition:border-color 0.15s;"
            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'"
            placeholder="Ex: 5mg, 10mg...">
          <span *ngIf="formMed.submitted && formMed.controls['dosagem']?.invalid" style="color:#dc2626; font-size:0.78rem;">Campo obrigatório.</span>
        </div>

        <div class="mb-3">
          <label style="font-size:0.85rem; font-weight:600; color:#374151; display:block; margin-bottom:6px;">Horário *</label>
          <input type="time" name="horario" [(ngModel)]="medicamento.horario" required
            style="width:100%; border:1px solid #e2e8f0; border-radius:10px; padding:10px 14px; font-size:0.92rem; outline:none; transition:border-color 0.15s;"
            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'">
          <span *ngIf="formMed.submitted && formMed.controls['horario']?.invalid" style="color:#dc2626; font-size:0.78rem;">Campo obrigatório.</span>
        </div>

        <div class="mb-3">
          <label style="font-size:0.85rem; font-weight:600; color:#374151; display:block; margin-bottom:6px;">Paciente *</label>
          <select name="paciente" [(ngModel)]="medicamento.paciente" required
            style="width:100%; border:1px solid #e2e8f0; border-radius:10px; padding:10px 14px; font-size:0.92rem; outline:none; background:#fff; transition:border-color 0.15s;"
            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'">
            <option [ngValue]="null">Selecione o paciente</option>
            <option *ngFor="let p of pacientes" [ngValue]="p">{{ p.nome }}</option>
          </select>
          <span *ngIf="formMed.submitted && formMed.controls['paciente']?.invalid" style="color:#dc2626; font-size:0.78rem;">Selecione um paciente.</span>
        </div>

        <div class="mb-3">
          <label style="font-size:0.85rem; font-weight:600; color:#374151; display:block; margin-bottom:6px;">Observações</label>
          <textarea name="observacao" [(ngModel)]="medicamento.observacao" rows="3"
            style="width:100%; border:1px solid #e2e8f0; border-radius:10px; padding:10px 14px; font-size:0.92rem; outline:none; resize:vertical; transition:border-color 0.15s;"
            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e2e8f0'"
            placeholder="Instruções adicionais..."></textarea>
        </div>

        <div class="mb-4">
          <label class="d-flex align-items-center gap-2" style="cursor:pointer; font-size:0.88rem; font-weight:500; color:#374151;">
            <input type="checkbox" name="ativo" [(ngModel)]="medicamento.ativo"
              style="width:16px; height:16px; accent-color:#6366f1;">
            Medicamento ativo
          </label>
        </div>

        <div class="d-flex gap-2">
          <button type="submit"
            style="background:#6366f1; color:#fff; border:none; border-radius:10px; padding:10px 28px; font-weight:600; font-size:0.92rem; cursor:pointer; flex:1;">
            {{ editando ? 'Salvar Alterações' : 'Cadastrar Medicamento' }}
          </button>
          <button type="button" (click)="voltar()"
            style="background:#f1f5f9; color:#475569; border:none; border-radius:10px; padding:10px 20px; font-weight:600; font-size:0.92rem; cursor:pointer;">
            Cancelar
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
